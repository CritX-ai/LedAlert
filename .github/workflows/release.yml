name: Linux and crates.io release

on:
  push:
    branches: [main]

permissions: {}

# A later push must not interrupt an in-flight external publication. Recovery is
# a rerun of the original main-push run, never a dispatch against a moving branch.
concurrency:
  group: ledalert-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'CritX-ai/LedAlert' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write
    steps:
      - name: Read the exact triggering source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Require licensed distribution metadata and inspect publication state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish.py preflight --commit "$GITHUB_SHA"
      - name: Install documentation build dependencies
        if: steps.preflight.outputs.release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pandoc
      - name: Require a complete production documentation build before release
        if: steps.preflight.outputs.release == 'true'
        run: python3 packaging/docs.py --container docker --output dist/docs
      - name: Build and verify native, source and Cargo downloads in the pinned baseline
        if: steps.preflight.outputs.release == 'true'
        run: python3 packaging/release.py --verify --crate --commit "$GITHUB_SHA" --output dist
      - name: Publish the versioned GitHub release without replacing existing bytes
        if: steps.preflight.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/publish.py github --commit "$GITHUB_SHA" --output dist
      - name: Publish the exact verified Cargo source to crates.io
        if: steps.preflight.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: python3 packaging/publish.py crate --commit "$GITHUB_SHA" --output dist
