<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Page not found — LedAlert</title>
  <link rel="icon" href="{{site_root}}media/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Saira; src: url("{{site_root}}media/fonts/saira.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: Silkscreen; src: url("{{site_root}}media/fonts/silkscreen-bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    :root { color-scheme: dark; font: 18px/1.7 Saira, sans-serif; background: #0c101d; color: #e9eefa; }
    body { max-width: 38rem; margin: 12vh auto; padding: 24px; }
    h1 { color: #ff657d; font: 700 clamp(1.6rem, 5vw, 2.4rem)/1.25 Silkscreen, sans-serif; text-wrap: balance; }
    a { color: #5be3d3; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #ffca77; outline-offset: 5px; }
    img { image-rendering: pixelated; }
    ::selection { background: #5be3d3; color: #0c101d; }
  </style>
</head>
<body>
  <img src="{{site_root}}media/mascots/alert.png" width="96" height="96" alt="LedAlert's mildly alarmed pixel diode">
  <h1>404. Lost in the field.</h1>
  <p>This page is missing or has moved. The manual is still operational.</p>
  <p><a href="{{site_root}}">Return to the field manual</a> or <a href="{{site_root}}guide/troubleshooting/">find a fix</a>.</p>
</body>
</html>
