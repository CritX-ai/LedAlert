[package]
name = "ledalert"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Spatial Linux desktop notifications and media activity mapped to WLED room lighting"
homepage = "https://alert.critx.ai/"
documentation = "https://alert.critx.ai/"
repository = "https://github.com/CritX-ai/LedAlert"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
categories = ["command-line-utilities", "gui"]
keywords = ["wled", "notifications", "linux", "lighting", "desktop"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/assets/ledalert.png",
    "/assets/fonts/Silkscreen-Bold.ttf",
    "/assets/fonts/OFL.txt",
    "/packaging/licenses/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ledalert-{ version }-{ target }.tar.gz"
bin-dir = "ledalert-{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ledalert-{ version }-linux-x86_64.tar.gz"
bin-dir = "ledalert-{ version }-linux-x86_64/bin/{ bin }{ binary-ext }"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "accesskit", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros", "net"] }
futures-util = "0.3"
png = "0.18"
resvg = { version = "0.45.1", default-features = false }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
