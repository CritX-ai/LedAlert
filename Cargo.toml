[package]
name = "ledalert"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Spatial desktop notifications for WLED on Linux"
repository = "https://github.com/CritX-ai/LedAlert"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "accesskit", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros", "net"] }
futures-util = "0.3"
png = "0.18"
resvg = { version = "0.45.1", default-features = false }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
